    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "Organization", "@id": "https://finflow.io/#organization", "name": "finflow", "url": "https://finflow.io", "logo": "https://status.finflow.io/finflow-logo.svg"}, {"@type": "WebPage", "@id": "https://status.finflow.io/#webpage", "url": "https://status.finflow.io/", "name": "finflow Status: Verfügbarkeit von Webseite, App und API", "description": "Aktueller Status von finflow: Erreichbarkeit von Webseite, App, API, E-Mail-Versand und API-Dokumentation, live geprüft alle 5 Minuten. Störungen und geplante Wartungen auf einen Blick.", "inLanguage": "de-DE", "publisher": {"@id": "https://finflow.io/#organization"}, "primaryImageOfPage": "https://status.finflow.io/og-image.png"}, {"@type": "FAQPage", "@id": "https://status.finflow.io/#faq", "inLanguage": "de-DE", "mainEntity": [{"@type": "Question", "name": "Ist finflow gerade gestört?", "acceptedAnswer": {"@type": "Answer", "text": "Oben auf dieser Seite steht der aktuelle Stand. „Alle Dienste laufen normal“ heißt, dass Webseite, App und API-Dokumentation bei der letzten Prüfung erreichbar waren. Bei einer Störung erscheint sie hier mit Beginn und Verlauf."}}, {"@type": "Question", "name": "Wie oft wird der Status geprüft?", "acceptedAnswer": {"@type": "Answer", "text": "Alle 5 Minuten. Geprüft werden finflow.io, Anmeldung und Registrierung der App, die App-Dienste mit Datenbank und Anmeldedienst, die API, der E-Mail-Versand, die Hintergrund-Aufgaben und die API-Dokumentation unter developers.finflow.io. Gemessen werden Erreichbarkeit und Antwortzeit."}}, {"@type": "Question", "name": "Wo erfahre ich von geplanten Wartungen?", "acceptedAnswer": {"@type": "Answer", "text": "Geplante Wartungen kündigen wir auf dieser Seite vorab an, mit Beginn und voraussichtlicher Dauer. Abgeschlossene Wartungen und frühere Störungen bleiben hier nachlesbar."}}]}]}</script>
  robotsText: |
    User-agent: *
    Allow: /

    Sitemap: https://status.finflow.io/sitemap.xml
  css: |
    /* Brand: finflow.io (navy #1C0A3C, Sofia Pro). Font is self-hosted on finflow.io (Fontspring web license). */
    @font-face { font-family: "sofia-pro"; src: url("https://finflow.io/fonts/sofia-pro/sofia-pro-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "sofia-pro"; src: url("https://finflow.io/fonts/sofia-pro/sofia-pro-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "sofia-pro"; src: url("https://finflow.io/fonts/sofia-pro/sofia-pro-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    :root {
      --brand-ink: #1c0a3c; --brand-accent: #1c0a3c; --brand-muted: #6b6581; --brand-border: #e8e6ee;
      --body-background-color: #f7f6fa; --body-text-color: #1c0a3c;
      --card-background-color: #ffffff; --card-border-color: #e8e6ee;
      --nav-background-color: #ffffff; --nav-border-bottom-color: #e8e6ee; --nav-current-border-bottom-color: #1c0a3c;
      --up-border-left-color: #12805a; --tag-up-background-color: #12805a;
      --degraded-border-left-color: #8f5a00; --tag-degraded-background-color: #8f5a00; --change-background-color: #fbf1dc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --brand-accent: #c9bdf2; --brand-muted: #a8a1bd; --brand-border: #2f2150;
        --body-background-color: #120726; --body-text-color: #f7f6fa;
        --card-background-color: #1c0a3c; --card-border-color: #2f2150;
        --nav-background-color: #120726; --nav-border-bottom-color: #2f2150; --nav-current-border-bottom-color: #c9bdf2;
        --up-border-left-color: #3fbf8a; --tag-up-background-color: #3fbf8a; --tag-color: #120726;
        --degraded-border-left-color: #e0a63c; --tag-degraded-background-color: #e0a63c; --change-background-color: #3a2a12;
      }
      nav .logo img { filter: brightness(0) invert(1); } /* navy logo becomes white */
      article { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px -12px rgba(0, 0, 0, 0.5); }
      article h4 img.icon { background: #f7f6fa; border-radius: 4px; padding: 1px; } /* dark site icons stay visible */
    }
    body { font-family: "sofia-pro", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-variant-numeric: lining-nums; }
    nav { margin-bottom: 2.5rem; background: var(--nav-background-color); border-bottom: 1px solid var(--nav-border-bottom-color); }
    nav .container { height: 56px; display: flex; align-items: center; justify-content: space-between; }
    nav .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    nav .logo img { height: 22px !important; width: auto !important; }
    nav .logo::after { content: "Status"; padding-left: 12px; border-left: 1px solid var(--brand-border); color: var(--brand-muted); font-size: 14px; font-weight: 500; }
    nav ul { gap: 24px; }
    nav ul a { color: var(--brand-muted); font-size: 14px !important; font-weight: 500 !important; padding: 18px 0 16px !important; text-decoration: none; }
    nav ul a:hover, nav ul a[aria-current] { color: var(--body-text-color); }
    [aria-current] { border-bottom-color: var(--brand-accent) !important; }
    h1, h2 { font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
    h1 { font-size: 2.25rem; }
    h2 { font-size: 1.25rem; }
    p.lead, header p { color: var(--brand-muted); }
    /* Cards: rounded like app icons on a phone, soft shadow, no coloured left bar; status shown as a pill */
    article { border: 1px solid var(--card-border-color) !important; border-radius: 22px; box-shadow: 0 1px 2px rgba(28, 10, 60, 0.04), 0 10px 30px -12px rgba(28, 10, 60, 0.14); overflow: hidden; }
    @supports (corner-shape: squircle) { article { border-radius: 36px; corner-shape: squircle; } }
    /* Service cards: text only (all services share the finflow mark), status as a pill with a coloured dot */
    section.live-status article h4 { display: flex; align-items: center; flex-wrap: wrap; gap: 0.625rem; }
    section.live-status article h4 img.icon { display: none !important; }
    section.live-status article { --c: #1f9d6b; }
    section.live-status article.degraded { --c: #b7791f; }
    section.live-status article.down { --c: #d92d3a; }
    section.live-status article h4::after { content: "Erreichbar"; padding: 3px 10px 3px 22px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 1.5; letter-spacing: 0.01em; color: var(--c); background: radial-gradient(circle at 12px 50%, var(--c) 0 3.5px, transparent 4px), color-mix(in srgb, var(--c) 9%, var(--card-background-color)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 22%, transparent), 0 1px 2px rgb(28 10 60 / 0.05); }
    section.live-status article.degraded h4::after { content: "Eingeschränkt"; }
    section.live-status article.down h4::after { content: "Ausgefallen"; }
    @media (prefers-color-scheme: dark) {
      section.live-status article { --c: #3fbf8a; }
      section.live-status article.degraded { --c: #e0a63c; }
      section.live-status article.down { --c: #f0525e; }
    }
    article.up, article.down, article.degraded { border-left: 1px solid var(--card-border-color) !important; }
    article.down, article.down-active { border-color: color-mix(in srgb, var(--tag-down-background-color) 45%, transparent) !important; border-left-color: color-mix(in srgb, var(--tag-down-background-color) 45%, transparent) !important; }
    .ff-faq { position: relative; z-index: 1; margin-top: 3rem; margin-bottom: 4rem; }
    .ff-faq h2 { margin-bottom: 1rem; }
    .ff-faq details { padding: 1rem 1.25rem; margin-bottom: 0.75rem; background: var(--card-background-color); border: 1px solid var(--card-border-color); border-radius: 18px; }
    .ff-faq summary { cursor: pointer; font-weight: 500; }
    .ff-faq summary:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 3px; border-radius: 4px; }
    .ff-faq p { margin: 0.75rem 0 0; color: var(--brand-muted); }
    a:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 3px; border-radius: 4px; }
    footer { display: none; }
    /* Animated background: finflow tiles (same as the hero on finflow.io/de/organisation), full screen behind the content */
    #ff-bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    main { position: relative; z-index: 1; }
    nav { position: relative; z-index: 2; }
    /* Phone: menu button that opens the links as a list */
    .ff-menu-btn { display: none; }
    @media (max-width: 600px) {
      nav { margin-bottom: 1.75rem; overflow: visible !important; }
      nav .container { height: 52px; }
      nav .logo { margin-right: 0; }
      nav .logo img { height: 18px !important; }
      .ff-menu-btn { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; border: 1px solid var(--brand-border); border-radius: 12px; background: transparent; color: var(--body-text-color); cursor: pointer; }
      .ff-menu-btn:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 2px; }
      .ff-menu-btn .ff-close, nav.ff-open .ff-menu-btn .ff-open-icon { display: none; }
      nav.ff-open .ff-menu-btn .ff-close { display: block; }
      nav ul { display: none !important; }
      nav.ff-open ul { display: flex !important; flex-direction: column; align-items: stretch !important; justify-content: flex-start !important; gap: 0 !important; position: absolute; top: 100%; left: 0; right: 0; padding: 4px 32px 12px !important; background: var(--nav-background-color); border-bottom: 1px solid var(--nav-border-bottom-color); box-shadow: 0 12px 24px rgba(28, 10, 60, 0.08); }
      nav.ff-open ul a { padding: 12px 0 !important; font-size: 16px !important; text-align: left; border-bottom: 0 !important; }
      form.r label { margin-left: 0.6rem !important; font-size: 14px; }
      nav.ff-open ul li + li { border-top: 1px solid var(--nav-border-bottom-color); }
    }
    /* Hero: lighter title like on finflow.io */
    header h1 { font-size: clamp(2rem, 4vw, 3rem); font-weight: 500; letter-spacing: -0.03em; line-height: 1.05; max-width: 18ch; }
    header p.lead { max-width: 60ch; }
    /* Readability: the pattern fades out behind the content column */
    #ff-bg { -webkit-mask-image: linear-gradient(90deg, #000 0%, rgba(0, 0, 0, 0.3) 28%, rgba(0, 0, 0, 0.12) 50%, rgba(0, 0, 0, 0.3) 72%, #000 100%); mask-image: linear-gradient(90deg, #000 0%, rgba(0, 0, 0, 0.3) 28%, rgba(0, 0, 0, 0.12) 50%, rgba(0, 0, 0, 0.3) 72%, #000 100%); }
    @media (max-width: 600px) { #ff-bg { -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.2)); mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.2)); } }
    /* Header as floating glass, same glass as the finflow.io header */
    nav { position: sticky !important; top: 0; z-index: 3; border-bottom: 0 !important; background: rgb(255 255 255 / 0.74) !important; -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.85), 0 0 0 1px rgb(28 10 60 / 0.06), 0 1px 2px rgb(28 10 60 / 0.04), 0 12px 32px -16px rgb(28 10 60 / 0.22); }
    .ff-menu-btn { border: 1px solid transparent !important; background: linear-gradient(180deg, rgb(255 255 255 / 0.95), rgb(245 243 250 / 0.8)) padding-box, linear-gradient(150deg, #ffffff 0%, #c9c3d8 35%, #f4f2f8 55%, #a9a2bd 100%) border-box !important; box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.9), 0 1px 2px rgb(28 10 60 / 0.08), 0 6px 14px -8px rgb(28 10 60 / 0.3); }
    @media (prefers-color-scheme: dark) {
      nav { background: rgb(43 24 86 / 0.62) !important; box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.1), 0 0 0 1px rgb(255 255 255 / 0.12), 0 12px 32px -16px rgb(0 0 0 / 0.5); }
      .ff-menu-btn { background: linear-gradient(180deg, rgb(70 52 120 / 0.9), rgb(43 24 86 / 0.8)) padding-box, linear-gradient(150deg, rgb(255 255 255 / 0.35) 0%, rgb(255 255 255 / 0.08) 40%, rgb(255 255 255 / 0.28) 60%, rgb(255 255 255 / 0.06) 100%) border-box !important; box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.15), 0 6px 14px -8px rgb(0 0 0 / 0.6); }
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { nav { background: var(--nav-background-color) !important; } }
    @media (max-width: 600px) {
      nav { top: 8px; margin: 8px 16px 1.5rem !important; padding: 0 8px 0 18px !important; border-radius: 24px; }
      .ff-menu-btn { border-radius: 16px !important; }
      nav.ff-open ul { border-radius: 20px !important; }
      nav .container { height: 56px; padding: 0 !important; }
      nav.ff-open ul { top: calc(100% + 8px) !important; border-radius: 16px; border-bottom: 0 !important; padding: 4px 20px 8px !important; background: #ffffff !important; box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.9), 0 0 0 1px rgb(28 10 60 / 0.07), 0 1px 2px rgb(28 10 60 / 0.05), 0 24px 48px -24px rgb(28 10 60 / 0.3) !important; }
      nav.ff-open ul li + li { border-top-color: rgb(28 10 60 / 0.08); }
      header h1 { font-size: 2rem; }
    }
    @media (max-width: 600px) and (prefers-color-scheme: dark) {
      nav.ff-open ul { background: #241448 !important; box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.1), 0 0 0 1px rgb(255 255 255 / 0.12), 0 24px 48px -24px rgb(0 0 0 / 0.6) !important; }
      nav.ff-open ul li + li { border-top-color: rgb(255 255 255 / 0.1); }
    }
    /* Overall status: replaces Upptime's emoji banner; orb in a metal ring, colour follows the live status */
    .ff-hidden { display: none !important; }
    .ff-overall { --c: #a8a1bd; display: flex; align-items: center; gap: 1rem; padding: 1.25rem 1.5rem !important; }
    .ff-overall[data-state="ok"] { --c: #1f9d6b; }
    @media (prefers-color-scheme: dark) { .ff-overall[data-state="ok"] { --c: #3fbf8a; } }
    .ff-overall[data-state="degraded"] { --c: #e0a63c; }
    .ff-overall[data-state="down"] { --c: #e5484d; }
    .ff-overall-title { margin: 0; font-size: 1.125rem; font-weight: 500; line-height: 1.3; }
    .ff-overall-detail { margin: 2px 0 0; font-size: 14px; color: var(--brand-muted); }
    .ff-mark { flex: none; width: 40px; height: 40px; }
    .ff-mark svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .ff-mark path { fill: var(--brand-ink); transition: fill 0.6s ease, filter 0.6s ease; }
    .ff-mark path.is-on { fill: var(--c); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--c) 55%, transparent)); }
    @media (prefers-color-scheme: dark) { .ff-mark path { fill: #f7f6fa; } .ff-mark path.is-on { fill: var(--c); } }
    @media (prefers-reduced-motion: reduce) { .ff-mark path { transition: none; } }
    /* E-mail alerts form and legal footer (Impressum, Datenschutz) */
    .ff-abo { position: relative; z-index: 1; margin-top: 3rem; }
    .ff-abo article { padding: 1.5rem !important; }
    .ff-abo h2 { margin: 0 0 0.375rem; }
    .ff-abo p { margin: 0; color: var(--brand-muted); }
    .ff-abo form { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.25rem; }
    .ff-abo input[type="email"] { flex: 1 1 240px; min-width: 0; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--card-border-color); background: var(--body-background-color); color: var(--body-text-color); font: inherit; font-size: 16px; }
    .ff-abo input[type="email"]:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 2px; }
    .ff-abo button { height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--brand-ink); color: #ffffff; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; }
    .ff-abo button:disabled { cursor: progress; opacity: 0.6; }
    .ff-abo button:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 3px; }
    .ff-abo label.ff-consent { flex-basis: 100%; display: flex; gap: 0.625rem; align-items: flex-start; font-size: 13px; line-height: 1.5; color: var(--brand-muted); }
    .ff-abo label.ff-consent input { margin-top: 3px; width: 16px; height: 16px; flex: none; accent-color: var(--brand-ink); }
    .ff-abo label.ff-consent a, .ff-legal a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
    .ff-abo .ff-abo-msg { flex-basis: 100%; min-height: 1.25rem; margin: 0; font-size: 14px; color: var(--body-text-color); }
    .ff-abo .ff-abo-msg[data-tone="ok"] { color: #12805a; }
    .ff-abo .ff-abo-msg[data-tone="error"] { color: #d92d3a; }
    .ff-legal { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; margin-top: 2.5rem; margin-bottom: 3rem; font-size: 13px; color: var(--brand-muted); }
    @media (prefers-color-scheme: dark) {
      .ff-abo button { background: #f7f6fa; color: #1c0a3c; }
      .ff-abo label.ff-consent input { accent-color: #c9bdf2; }
      .ff-abo .ff-abo-msg[data-tone="ok"] { color: #3fbf8a; }
      .ff-abo .ff-abo-msg[data-tone="error"] { color: #f0525e; }
    }
  js: |
    (() => {
      // Upptime shows "Completed" untranslated for past maintenance.
      // Incident titles come from Upptime in English with emoji; show them in German without emoji.
      const EMOJI = /^[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}\s]+/u;
      const translate = () => {
        document.querySelectorAll("main div").forEach((d) => {
          if (d.childElementCount === 0 && d.textContent.trim() === "Completed") d.textContent = "Abgeschlossen";
        });
        document.querySelectorAll("main h4, main h2, main a").forEach((el) => {
          if (el.childElementCount !== 0) return;
          const t = el.textContent;
          const n = t.replace(EMOJI, "").replace(/ is down\b.*$/, " ist ausgefallen").replace(/ has degraded performance\b.*$/, " ist eingeschränkt").replace(/ is up\b.*$/, " ist wieder erreichbar");
          if (n !== t) el.textContent = n;
        });
      };

      // Overall status in the banner, from the same data as the cards.
      const SUMMARY_URL = "https://raw.githubusercontent.com/finflow-io/finflow-status/master/history/summary.json";
      let overall = { state: "unknown", title: "Aktueller Status", detail: "Wird geladen …" };
      const renderOverall = () => {
        const el = document.querySelector("main .ff-overall");
        if (!el) return;
        el.dataset.state = overall.state;
        el.querySelector(".ff-overall-title").textContent = overall.title;
        el.querySelector(".ff-overall-detail").textContent = overall.detail;
        markStep();
      };
      // One field of the finflow mark carries the status colour and moves on clockwise.
      const ORDER = [1, 3, 2, 0];
      let markIndex = 0;
      const markStep = () => {
        const paths = document.querySelectorAll("main .ff-mark path");
        paths.forEach((p, i) => p.classList.toggle("is-on", overall.state !== "unknown" && i === ORDER[markIndex % 4]));
      };
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        setInterval(() => { markIndex++; markStep(); }, 2400);
      }
      const ensureBanner = () => {
        const main = document.querySelector("main");
        if (!main) return;
        main.querySelectorAll("article.up:not(.link)").forEach((a) => { if (!a.classList.contains("ff-overall")) a.classList.add("ff-hidden"); });
        if (main.querySelector(".ff-overall")) return;
        const el = document.createElement("article");
        el.className = "ff-overall";
        el.setAttribute("role", "status");
        el.setAttribute("aria-live", "polite");
        el.innerHTML = '<span class="ff-mark" aria-hidden="true"><svg viewBox="0 0 139.27 139.27"><path d="M64.0642 0C64.0642 35.3817 35.3817 64.0642 0 64.0642V49.8475C0 32.3993 0.000408084 23.6746 3.39607 17.0103C6.38289 11.1486 11.1486 6.38289 17.0103 3.39607C23.6746 0.000408084 32.3993 0 49.8475 0H64.0642Z"/><path d="M89.4225 0C106.871 0 115.595 0.000408084 122.26 3.39607C128.121 6.38289 132.887 11.1486 135.874 17.0103C139.27 23.6746 139.27 32.3993 139.27 49.8475V64.0642H75.2058V0H89.4225Z"/><path d="M64.0642 139.27H49.8475C32.3993 139.27 23.6746 139.27 17.0103 135.874C11.1486 132.887 6.38289 128.121 3.39607 122.26C0.000408084 115.595 0 106.871 0 89.4225V75.2058H64.0642V139.27Z"/><path d="M139.27 89.4225C139.27 106.871 139.27 115.595 135.874 122.26C132.887 128.121 128.121 132.887 122.26 135.874C115.595 139.27 106.871 139.27 89.4225 139.27H75.2058C75.2058 103.888 103.888 75.2058 139.27 75.2058V89.4225Z"/></svg></span><div><p class="ff-overall-title"></p><p class="ff-overall-detail"></p></div>';
        const header = main.querySelector("header");
        if (header) header.after(el); else main.prepend(el);
        renderOverall();
      };
      const loadOverall = () => fetch(SUMMARY_URL + "?t=" + Math.floor(Date.now() / 60000))
        .then((r) => (r.ok ? r.json() : Promise.reject()))
        .then((sites) => {
          if (!Array.isArray(sites) || !sites.length) throw new Error();
          const down = sites.filter((x) => x.status === "down").map((x) => x.name);
          const slow = sites.filter((x) => x.status === "degraded").map((x) => x.name);
          if (down.length) overall = { state: "down", title: "Störung", detail: "Betroffen: " + down.join(", ") };
          else if (slow.length) overall = { state: "degraded", title: "Eingeschränkt erreichbar", detail: "Langsamer als üblich: " + slow.join(", ") };
          else overall = { state: "ok", title: "Alle Dienste laufen normal", detail: sites.length + " von " + sites.length + " Diensten erreichbar" };
        })
        .catch(() => { overall = { state: "unknown", title: "Aktueller Status", detail: "Gerade nicht abrufbar. Bitte lade die Seite gleich neu." }; })
        .then(renderOverall);

      // Phone menu: a button in the header opens and closes the links. The page may
      // re-render the header after load, so handlers always look up the current one.
      const setMenu = (open) => {
        const nav = document.querySelector("nav");
        const btn = nav && nav.querySelector(".ff-menu-btn");
        if (!nav || !btn) return;
        nav.classList.toggle("ff-open", open);
        btn.setAttribute("aria-expanded", String(open));
        btn.setAttribute("aria-label", open ? "Menü schließen" : "Menü öffnen");
      };
      const menuOpen = () => { const nav = document.querySelector("nav"); return !!nav && nav.classList.contains("ff-open"); };
      let menuBound = false;
      const ensureMenu = () => {
        const nav = document.querySelector("nav");
        const container = nav && nav.querySelector(".container");
        const list = nav && nav.querySelector("ul");
        if (!container || !list) return;
        list.id = "ff-menu";
        if (!container.querySelector(".ff-menu-btn")) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "ff-menu-btn";
          btn.setAttribute("aria-controls", "ff-menu");
          btn.setAttribute("aria-expanded", "false");
          btn.setAttribute("aria-label", "Menü öffnen");
          btn.innerHTML = '<svg class="ff-open-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><svg class="ff-close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
          nav.classList.remove("ff-open");
          container.appendChild(btn);
        }
        if (menuBound) return;
        menuBound = true;
        document.addEventListener("click", (e) => {
          const nav = document.querySelector("nav");
          if (!nav) return;
          if (e.target.closest(".ff-menu-btn")) { setMenu(!menuOpen()); return; }
          if (e.target.closest("nav ul a") || !nav.contains(e.target)) setMenu(false);
        });
        document.addEventListener("keydown", (e) => {
          if (e.key !== "Escape" || !menuOpen()) return;
          setMenu(false);
          const btn = document.querySelector("nav .ff-menu-btn");
          if (btn) btn.focus();
        });
      };

      // E-mail alerts: double opt-in via finflow.io/api/status-abo, then legal links.
      const ABO_API = "https://finflow.io/api/status-abo";
      const ABO_HTML = '<section class="container ff-abo" aria-labelledby="ff-abo-title"><article>' +
        '<h2 id="ff-abo-title">Bei Störungen per E-Mail informiert werden</h2>' +
        '<p>Wir schreiben dir, wenn ein Dienst gestört ist, wenn er wieder läuft und wenn eine Wartung geplant ist. Abmelden kannst du dich jederzeit.</p>' +
        '<form novalidate><input type="email" name="email" autocomplete="email" placeholder="E-Mail-Adresse" aria-label="E-Mail-Adresse" required>' +
        '<button type="submit">Anmelden</button>' +
        '<label class="ff-consent"><input type="checkbox" name="consent" required><span>Ich möchte per E-Mail informiert werden, wenn Dienste von finflow gestört sind, wieder laufen oder Wartungen geplant sind. Abmelden kann ich mich jederzeit über den Link in jeder E-Mail. Mehr dazu in der <a href="https://finflow.io/de/rechtliches/datenschutz-status">Datenschutzerklärung</a>.</span></label>' +
        '<p class="ff-abo-msg" role="status" aria-live="polite"></p></form></article></section>';
      const LEGAL_HTML = '<div class="container ff-legal"><span>© finflow GmbH</span><a href="https://finflow.io/de/rechtliches/impressum">Impressum</a><a href="https://finflow.io/de/rechtliches/datenschutz-status">Datenschutz</a></div>';
      const ABO_RUECKMELDUNG = {
        bestaetigt: ["ok", "Danke, deine Anmeldung ist bestätigt. Ab jetzt informieren wir dich per E-Mail."],
        abgelaufen: ["error", "Der Bestätigungslink ist abgelaufen oder ungültig. Bitte melde dich noch einmal an."],
        fehler: ["error", "Die Bestätigung hat gerade nicht geklappt. Bitte öffne den Link in ein paar Minuten noch einmal."],
      };
      let aboHinweis = null;
      try {
        const abo = new URLSearchParams(location.search).get("abo");
        if (abo && ABO_RUECKMELDUNG[abo]) {
          aboHinweis = ABO_RUECKMELDUNG[abo];
          history.replaceState(null, "", location.pathname + location.hash);
        }
      } catch (e) {}
      const ensureAbo = () => {
        const main = document.querySelector("main");
        if (!main || document.querySelector(".ff-abo")) return;
        main.insertAdjacentHTML("afterend", ABO_HTML);
        const form = document.querySelector(".ff-abo form");
        const msg = form.querySelector(".ff-abo-msg");
        const zeige = (tone, text) => { msg.dataset.tone = tone; msg.textContent = text; };
        if (aboHinweis) { zeige(aboHinweis[0], aboHinweis[1]); setTimeout(() => document.querySelector(".ff-abo").scrollIntoView({ block: "center" }), 300); }
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const email = form.email.value.trim();
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return zeige("error", "Bitte gib eine gültige E-Mail-Adresse an.");
          if (!form.consent.checked) return zeige("error", "Bitte bestätige die Einwilligung.");
          const btn = form.querySelector("button");
          btn.disabled = true;
          zeige("", "Wird gesendet …");
          fetch(ABO_API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: email, consent: true }) })
            .then((r) => r.json().catch(() => ({})).then((d) => ({ ok: r.ok, d: d })))
            .then(({ ok, d }) => {
              if (ok) { zeige("ok", "Fast geschafft: Bitte klicke auf den Link in der E-Mail, die wir dir gerade geschickt haben."); form.reset(); }
              else zeige("error", d.error || "Gerade klappt die Anmeldung nicht. Bitte versuche es gleich noch einmal.");
            })
            .catch(() => zeige("error", "Gerade klappt die Anmeldung nicht. Bitte versuche es gleich noch einmal."))
            .then(() => { btn.disabled = false; });
        });
      };
      const ensureLegal = () => {
        if (document.querySelector(".ff-legal")) return;
        const after = document.querySelector(".ff-faq") || document.querySelector(".ff-abo") || document.querySelector("main");
        if (after) after.insertAdjacentHTML("afterend", LEGAL_HTML);
      };

      // Questions and answers below the status (same text as the FAQPage data in the page head).
      const FAQ_HTML = `<section class="container ff-faq" aria-labelledby="ff-faq-title">
          <h2 id="ff-faq-title">Häufige Fragen</h2>
          <details><summary>Ist finflow gerade gestört?</summary><p>Oben auf dieser Seite steht der aktuelle Stand. „Alle Dienste laufen normal“ heißt, dass Webseite, App und API-Dokumentation bei der letzten Prüfung erreichbar waren. Bei einer Störung erscheint sie hier mit Beginn und Verlauf.</p></details>
          <details><summary>Wie oft wird der Status geprüft?</summary><p>Alle 5 Minuten. Geprüft werden finflow.io, Anmeldung und Registrierung der App, die App-Dienste mit Datenbank und Anmeldedienst, die API, der E-Mail-Versand, die Hintergrund-Aufgaben und die API-Dokumentation unter developers.finflow.io. Gemessen werden Erreichbarkeit und Antwortzeit.</p></details>
          <details><summary>Wo erfahre ich von geplanten Wartungen?</summary><p>Geplante Wartungen kündigen wir auf dieser Seite vorab an, mit Beginn und voraussichtlicher Dauer. Abgeschlossene Wartungen und frühere Störungen bleiben hier nachlesbar.</p></details>
        </section>`;
      const ensureFaq = () => {
        const main = document.querySelector("main");
        if (!main || document.querySelector(".ff-faq")) return;
        (document.querySelector(".ff-abo") || main).insertAdjacentHTML("afterend", FAQ_HTML);
      };

      // Background: the four fields of the finflow mark as a tile pattern. A slow wave runs
      // diagonally and turns single tiles by 90 degrees; turning tiles briefly show darker.
      // Same as TileWave on finflow.io/de/organisation. Reduced motion shows a still image.
      const startBackground = () => {
        if (document.getElementById("ff-bg") || typeof Path2D === "undefined") return;
        const LOGO = 139.27;
        const PATHS = [
          "M64.0642 0C64.0642 35.3817 35.3817 64.0642 0 64.0642V49.8475C0 32.3993 0.000408084 23.6746 3.39607 17.0103C6.38289 11.1486 11.1486 6.38289 17.0103 3.39607C23.6746 0.000408084 32.3993 0 49.8475 0H64.0642Z",
          "M89.4225 0C106.871 0 115.595 0.000408084 122.26 3.39607C128.121 6.38289 132.887 11.1486 135.874 17.0103C139.27 23.6746 139.27 32.3993 139.27 49.8475V64.0642H75.2058V0H89.4225Z",
          "M64.0642 139.27H49.8475C32.3993 139.27 23.6746 139.27 17.0103 135.874C11.1486 132.887 6.38289 128.121 3.39607 122.26C0.000408084 115.595 0 106.871 0 89.4225V75.2058H64.0642V139.27Z",
          "M139.27 89.4225C139.27 106.871 139.27 115.595 135.874 122.26C132.887 128.121 128.121 132.887 122.26 135.874C115.595 139.27 106.871 139.27 89.4225 139.27H75.2058C75.2058 103.888 103.888 75.2058 139.27 75.2058V89.4225Z",
        ];
        const TILE = 64, GAP = 0.32, PERIOD = 9, TURN = 0.14;
        const hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
        const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
        const canvas = document.createElement("canvas");
        canvas.id = "ff-bg";
        canvas.setAttribute("aria-hidden", "true");
        document.body.prepend(canvas);
        const ctx = canvas.getContext("2d");
        if (!ctx) return;
        const paths = PATHS.map((d) => new Path2D(d));
        const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const dark = window.matchMedia("(prefers-color-scheme: dark)");
        let width = 0, height = 0, time = 0, last = performance.now(), frame = 0;
        const draw = () => {
          ctx.clearRect(0, 0, width, height);
          const cols = Math.ceil(width / TILE) + 1, rows = Math.ceil(height / TILE) + 1;
          const k = (TILE * (1 - GAP)) / LOGO, diag = width + height;
          const rgb = dark.matches ? "201, 189, 242" : "28, 10, 60";
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const x = c * TILE + TILE / 2, y = r * TILE + TILE / 2;
              const phase = time / PERIOD - ((width - x + y * 0.8) / diag) * 1.6;
              const cycle = Math.floor(phase), frac = phase - cycle;
              let turns = Math.floor(hash(c, r) * 4);
              for (let i = cycle - 8; i < cycle; i++) if (hash(c + i * 7, r - i * 3) < 0.3) turns++;
              const active = hash(c + cycle * 7, r - cycle * 3) < 0.3;
              const turning = active && !reduced && frac < TURN ? ease(frac / TURN) : active && frac >= TURN ? 1 : 0;
              const glow = active && !reduced && frac < TURN * 2.2 ? Math.sin((frac / (TURN * 2.2)) * Math.PI) : 0;
              ctx.save();
              ctx.translate(x, y);
              ctx.rotate(((turns + turning) * Math.PI) / 2);
              ctx.scale(k, k);
              ctx.translate(-LOGO / 2, -LOGO / 2);
              ctx.fillStyle = "rgba(" + rgb + ", " + (0.05 + glow * 0.16) + ")";
              for (const p of paths) ctx.fill(p);
              ctx.restore();
            }
          }
        };
        const resize = () => {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const rect = canvas.getBoundingClientRect();
        width = rect.width; height = rect.height;
          canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          draw();
        };
        const loop = (now) => {
          time += Math.min(0.05, (now - last) / 1000);
          last = now;
          draw();
          frame = requestAnimationFrame(loop);
        };
        const run = () => {
          cancelAnimationFrame(frame);
          if (reduced || document.hidden) return;
          last = performance.now();
          frame = requestAnimationFrame(loop);
        };
        window.addEventListener("resize", resize);
        dark.addEventListener("change", draw);
        document.addEventListener("visibilitychange", run);
        resize();
        run();
      };

      const init = () => {
        translate();
        ensureMenu();
        ensureAbo();
        ensureFaq();
        ensureLegal();
        ensureBanner();
        loadOverall();
        setInterval(loadOverall, 5 * 60 * 1000);
        startBackground();
        new MutationObserver(() => { translate(); ensureMenu(); ensureAbo(); ensureFaq(); ensureLegal(); ensureBanner(); }).observe(document.body, { subtree: true, childList: true });
      };
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
      else init();
    })();
