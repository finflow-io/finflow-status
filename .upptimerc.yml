# Upptime configuration for status.finflow.io
# Docs: https://upptime.js.org/docs/configuration

owner: finflow-io
repo: finflow-status

sites:
  - name: Webseite
    icon: https://status.finflow.io/finflow-icon.svg
    url: https://finflow.io
  - name: App
    icon: https://status.finflow.io/finflow-icon.svg
    # The login page must answer and show its real content.
    # app.finflow.io/ redirects to /register, so the login page is checked directly.
    url: https://app.finflow.io/login
    __dangerous__body_down_if_text_missing: "Anmelden"
    maxResponseTime: 3000
  - name: Registrierung
    icon: https://status.finflow.io/finflow-icon.svg
    # Public sign-up page, checked like the login page.
    url: https://app.finflow.io/register
    __dangerous__body_down_if_text_missing: "Konto erstellen"
    maxResponseTime: 3000
  # Health endpoints of the app (documented on developers.finflow.io): answer "ok" (200) or 503, no details.
  # /api/health covers the app as a whole incl. database and sign-in; /api/health/database is not shown separately.
  - name: App-Dienste
    icon: https://status.finflow.io/finflow-icon.svg
    url: https://app.finflow.io/api/health
    maxResponseTime: 3000
  - name: API
    icon: https://status.finflow.io/finflow-icon.svg
    url: https://app.finflow.io/api/health/api
    maxResponseTime: 3000
  - name: E-Mail-Versand
    icon: https://status.finflow.io/finflow-icon.svg
    url: https://app.finflow.io/api/health/mail
    maxResponseTime: 5000
  - name: Hintergrund-Aufgaben
    icon: https://status.finflow.io/finflow-icon.svg
    url: https://app.finflow.io/api/health/queue
    maxResponseTime: 3000
  - name: API-Dokumentation
    icon: https://status.finflow.io/finflow-icon.svg
    url: https://developers.finflow.io
  # Not live yet; enable once the waiting page exists.
  # - name: Community
  #   icon: https://status.finflow.io/finflow-icon.svg
  #   url: https://community.finflow.io
  #   __dangerous__body_down_if_text_missing: "<fester Text der Warteseite>"

# Outages open an issue assigned here; GitHub notifies by email.
assignees:
  - christian-finflow

